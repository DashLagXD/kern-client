name: Kern Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Download source and bundled libraries
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        run: rustup default stable

      - name: Configure Kern Client
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=.
          -DCLIENT=ON -DSERVER=OFF -DTOOLS=OFF
          -DVULKAN=OFF -DEXCEPTION_HANDLING=ON
          -DPREFER_BUNDLED_LIBS=ON
          -DCLIENT_EXECUTABLE=Kern

      - name: Build and package client
        run: cmake --build build --config Release --target package_zip --parallel 2

      - name: Save Windows download
        uses: actions/upload-artifact@v4
        with:
          name: Kern-Client-Windows-x64
          path: build/*-win64.zip
          if-no-files-found: error
          retention-days: 14
